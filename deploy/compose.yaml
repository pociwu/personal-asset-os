name: personal-asset-os

services:
  web:
    image: personal-asset-os/web:${PAOS_IMAGE_TAG:-candidate}
    build:
      context: ..
      dockerfile: deploy/nginx/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "127.0.0.1:${PAOS_WEB_PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - edge
      - internal

  backend:
    image: personal-asset-os/backend:${PAOS_IMAGE_TAG:-candidate}
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      PAOS_APP_ENV: production
      PAOS_LOG_LEVEL: INFO
      PAOS_POSTGRES_HOST: postgres
      PAOS_POSTGRES_PORT: "5432"
      PAOS_POSTGRES_DB: personal_asset_os
      PAOS_POSTGRES_USER: personal_asset_os
      PAOS_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PAOS_REDIS_HOST: redis
      PAOS_REDIS_PORT: "6379"
      PAOS_REDIS_PASSWORD_FILE: /run/secrets/redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready',
          timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    secrets:
      - postgres_password
      - redis_password
    networks:
      - internal

  postgres:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_DB: personal_asset_os
      POSTGRES_USER: personal_asset_os
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7.4.10-bookworm
    user: redis
    command:
      - sh
      - -euc
      - |
        secret="$$(cat /run/secrets/redis_password)"
        test "$${#secret}" -ge 32
        case "$$secret" in *[!A-Za-z0-9_-]*) exit 1 ;; esac
        umask 077
        printf 'user default on >%s ~* &* +@all\n' "$$secret" > /run/redis-auth/users.acl
        unset secret
        exec redis-server --aclfile /run/redis-auth/users.acl
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$(cat /run/secrets/redis_password)" redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    secrets:
      - redis_password
    tmpfs:
      - /run/redis-auth:mode=0700,uid=999,gid=999,size=64k
    networks:
      - internal

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres_data:

secrets:
  postgres_password:
    file: ${PAOS_SECRET_DIR:-/opt/ai-pm-os/secrets/personal-asset-os}/postgres_password
  redis_password:
    file: ${PAOS_SECRET_DIR:-/opt/ai-pm-os/secrets/personal-asset-os}/redis_password
