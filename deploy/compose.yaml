name: personal-asset-os

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      PAOS_APP_ENV: production
      PAOS_LOG_LEVEL: INFO
      PAOS_POSTGRES_HOST: postgres
      PAOS_POSTGRES_PORT: "5432"
      PAOS_POSTGRES_DB: personal_asset_os
      PAOS_POSTGRES_USER: personal_asset_os
      PAOS_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PAOS_REDIS_HOST: redis
      PAOS_REDIS_PORT: "6379"
      PAOS_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready',
          timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: postgres:16.14-bookworm
    environment:
      POSTGRES_DB: personal_asset_os
      POSTGRES_USER: personal_asset_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7.4.10-bookworm
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD"
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    internal: true

volumes:
  postgres_data:
