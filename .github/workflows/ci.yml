name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-dependencies:
    name: Quality and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.17.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run unified quality gate
        run: python scripts/verify/quality.py

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          uv export --locked --no-dev --no-emit-project \
            --output-file "${RUNNER_TEMP}/paos-requirements.txt"
          uv run --locked pip-audit --strict \
            --requirement "${RUNNER_TEMP}/paos-requirements.txt"

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ubuntu-integration:
    name: Ubuntu Compose and restore drill
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install age
        run: |
          sudo apt-get update
          sudo apt-get install --yes age

      - name: Run isolated integration verification
        run: scripts/verify/ubuntu-integration.sh

  container-security:
    name: Filesystem and container scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Build runtime images
        run: docker compose --file deploy/compose.yaml build

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: personal-asset-os/backend:candidate
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: personal-asset-os/web:candidate
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
